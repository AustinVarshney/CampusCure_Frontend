<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>CampusCure — Campus complaints & doubts, in one workspace</title>
    <meta
      name="description"
      content="CampusCure routes campus complaints to the right desk, hosts a faculty-verified doubt community, and gives administrators the numbers behind both."
    />
    <meta name="theme-color" content="#07759D" />

    <!-- Preconnect before the font CSS is requested; without it the browser
         pays a fresh DNS + TLS round trip on the font files themselves. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CampusCure" />
    <meta
      property="og:description"
      content="One workspace for campus complaints and academic doubts."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
